server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Cookies are scoped to a host, not a port, so every other dev server you
  # have ever run on localhost shares this jar. That pile-up overruns nginx's
  # default 8k header buffer and returns 400 before any handler runs.
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Proxying keeps the browser on a single origin in containers exactly as the
  # Vite dev proxy does locally, so the API's deny-by-default CORS policy never
  # needs an exception.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API authenticates with bearer tokens and reads no cookies, so drop
    # them rather than forwarding kilobytes of unrelated state to Node (whose
    # own 16k header cap would reject it anyway).
    proxy_set_header Cookie "";
  }

  location = /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Cookie "";
  }

  location = /ready {
    proxy_pass http://api:3000/ready;
    proxy_set_header Cookie "";
  }

  # Single-page app: unknown paths fall through to index.html so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
