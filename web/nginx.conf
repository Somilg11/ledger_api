# Hashed assets are immutable; HTML must revalidate after a deployment.
map $uri $ledger_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/(api/|health|ready) "no-store";
}
# Do not retain email-verification tokens or other query strings in access logs.
log_format ledger_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log ledger_safe;

  # Cookies are scoped to a host, not a port, so every other dev server you
  # have ever run on localhost shares this jar. That pile-up overruns nginx's
  # default 8k header buffer and returns 400 before any handler runs.
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  client_max_body_size 100k;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $ledger_cache_control always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_vary on;

  location /assets/ {
    try_files $uri =404;
  }

  # Proxying keeps the browser on a single origin in containers exactly as the
  # Vite dev proxy does locally, so the API's deny-by-default CORS policy never
  # needs an exception.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # The API authenticates with bearer tokens and reads no cookies, so drop
    # them rather than forwarding kilobytes of unrelated state to Node (whose
    # own 16k header cap would reject it anyway).
    proxy_set_header Cookie "";
  }

  location = /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Cookie "";
  }

  location = /ready {
    proxy_pass http://api:3000/ready;
    proxy_set_header Cookie "";
  }

  # Single-page app: unknown paths fall through to index.html so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
