server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Proxying keeps the browser on a single origin in containers exactly as the
  # Vite dev proxy does locally, so the API's deny-by-default CORS policy never
  # needs an exception.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health { proxy_pass http://api:3000/health; }
  location = /ready  { proxy_pass http://api:3000/ready; }

  # Single-page app: unknown paths fall through to index.html so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
